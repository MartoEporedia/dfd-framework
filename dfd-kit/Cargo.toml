[package]
name = "dfd-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Workflow DFD portabili per gli harness di coding"
publish = false

[[bin]]
name = "dfd"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.2", features = ["derive"] }
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
